# ==============================================================================
# PawMatch Backend Continuous Integration (CI) Workflow
# Validates code quality, linting, Django system checks, unit tests, & Docker builds
# ==============================================================================

name: PawMatch Backend CI

on:
  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'render.yaml'
  pull_request:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'render.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code Quality, Security & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install Production & Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Verify Code Formatting (Black & isort)
        run: |
          isort --profile black --check .
          black --check .

      - name: Verify Code Linting (Flake8 Syntax & Critical Errors)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Run Django System Checks (Development Environment)
        run: |
          python manage.py check --settings=config.settings.development

      - name: Run Django Security Checks (Production Environment)
        env:
          SECRET_KEY: 'ci-secret-key-for-django-check-deploy-testing-12345'
          DEBUG: 'False'
          ALLOWED_HOSTS: '.onrender.com,api.pawmatch.com'
          SECURE_SSL_REDIRECT: 'True'
        run: |
          python manage.py check --deploy --settings=config.settings.production

      - name: Execute Automated Test Suite (pytest)
        env:
          SECRET_KEY: 'ci-testing-secret-key'
          DEBUG: 'True'
        run: |
          pytest

  docker-build:
    name: Docker Container Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image (No Registry Push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: pawmatch-backend:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max
